<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official Links & Music Hub for DLAWAR SALEH - Singer & Musical Artist">
    <title>DLAWAR SALEH - Music Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 40px;
        }

        .links-section {
            margin: 40px 0;
        }

        .links-section h2 {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .social-links {
            display: grid;
            gap: 12px;
            margin-bottom: 30px;
        }

        .link-btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            text-align: center;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .music-platforms {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .music-btn {
            padding: 12px 20px;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid #667eea;
        }

        .music-btn:hover {
            background: #667eea;
            color: white;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            
            .container {
                padding: 25px;
            }

            .music-platforms {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-img">🎤</div>
        <h1>DLAWAR SALEH</h1>
        <p class="subtitle">Singer & Musical Artist</p>

        <div class="links-section">
            <h2>Follow & Connect</h2>
            <div class="social-links">
                <!-- Add your social media links here -->
                <a href="#" class="link-btn">🎵 Listen on Spotify</a>
                <a href="#" class="link-btn">🎥 YouTube Channel</a>
                <a href="#" class="link-btn">📱 Instagram</a>
                <a href="#" class="link-btn">🐦 Twitter</a>
                <a href="#" class="link-btn">💬 TikTok</a>
                <a href="#" class="link-btn">🎵 Apple Music</a>
            </div>
        </div>

        <div class="links-section">
            <h2>Music Streaming</h2>
            <div class="music-platforms">
                <a href="#" class="music-btn">Spotify</a>
                <a href="#" class="music-btn">Apple Music</a>
                <a href="#" class="music-btn">YouTube Music</a>
                <a href="#" class="music-btn">SoundCloud</a>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 DLAWAR SALEH. All rights reserved.</p>
            <p>Official Links & Music Hub</p>
        </div>
    </div>
</body>
</html>
